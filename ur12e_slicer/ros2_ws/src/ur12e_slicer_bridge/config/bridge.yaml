ur12e_slicer_bridge:
  ros__parameters:
    base_frame: base
    tool_frame: tool0
    tip_offset_m: [0.0, 0.0, 0.12]
    planning_group: ur_manipulator
    pipeline_id: ompl
    # Use the planner configured for this group by the installed UR MoveIt config.
    planner_id: ""
    controller_name: joint_trajectory_controller
    planning_time_s: 5.0
    position_tolerance_m: 0.002
    # Overall orientation-angle budget. Each rotation-vector axis receives
    # this value / sqrt(3), so their combined norm cannot exceed the budget.
    orientation_tolerance_rad: 0.03
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    feedback_hz: 10.0
    max_feedback_age_s: 1.0
    command_max_age_s: 60.0
    execution_timeout_s: 120.0
