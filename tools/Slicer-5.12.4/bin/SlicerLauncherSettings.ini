[General]
launcherNoSplashScreen=false
launcherSplashImagePath=<APPLAUNCHER_DIR>/bin/Slicer-SplashScreen.png
launcherSplashScreenHideDelayMs=180000
launcherSplashScreenIgnoreOutput=false
additionalLauncherHelpShortArgument=-h
additionalLauncherHelpLongArgument=--help
additionalLauncherNoSplashArguments=--no-splash,--help,--version,--home,--program-path,--no-main-window,--settings-path,--temporary-path





[Application]
path=<APPLAUNCHER_DIR>/bin/SlicerApp-real.exe
arguments=
name=Slicer
revision=34645
organizationDomain=slicer.org
organizationName=slicer.org

[ExtraApplicationToLaunch]

cmd/shortArgument=
cmd/help=Start cmd
cmd/path=C:/Windows/System32/cmd.exe
cmd/arguments=/c start cmd

designer/shortArgument=
designer/help=Start Qt designer using Slicer plugins
designer/path=<APPLAUNCHER_SETTINGS_DIR>/../bin/designer-real.exe
designer/arguments=

lconvert/shortArgument=
lconvert/help=Start Qt lconvert language utility
lconvert/path=<APPLAUNCHER_SETTINGS_DIR>/../bin/lconvert.exe
lconvert/arguments=

lrelease/shortArgument=
lrelease/help=Start Qt lrelease language utility
lrelease/path=<APPLAUNCHER_SETTINGS_DIR>/../bin/lrelease.exe
lrelease/arguments=

lupdate/shortArgument=
lupdate/help=Start Qt lupdate language utility
lupdate/path=<APPLAUNCHER_SETTINGS_DIR>/../bin/lupdate.exe
lupdate/arguments=


